<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FLARE U Admin</title>

    <link rel="stylesheet" href="css/globalcms.css">

</head>

<body>

<div class="admin-container">

    <!-- =========================
            SIDEBAR
    ========================== -->

    <!-- =========================
        SIDEBAR
========================= -->

<aside class="sidebar">

    <div>

        <div class="logo">
            <h2>FLARE U</h2>
            <span>ADMIN PANEL</span>
        </div>

        <nav class="menu">

            <a href="#" class="active">
                <span>🏠</span>
                Dashboard
            </a>

            <a href="#">
                <span>💬</span>
                Social Update
            </a>

            <a href="#">
                <span>📅</span>
                Schedule
            </a>

            <a href="#">
                <span>🗳</span>
                Vote
            </a>

            <a href="#">
                <span>📖</span>
                Guide
            </a>

            <a href="#">
                <span>▶</span>
                YouTube
            </a>

            <a href="#">
                <span>💿</span>
                Discography
            </a>

            <a href="#">
                <span>⚙</span>
                Settings
            </a>

        </nav>

    </div>

    <div class="sidebar-footer">

        <div class="admin-info">

            <div class="avatar">
                A
            </div>

            <div>

                <h4>Admin</h4>
                <small>FLARE U</small>

            </div>

        </div>

        <button class="logout-btn">
            Logout
        </button>

    </div>

</aside>
    <!-- =========================
            MAIN
    ========================== -->

    <main class="main-content">

        <!-- Header -->

        <header class="header">

            <div>

                <h1>Dashboard</h1>
                <p>Welcome back, Admin!</p>

            </div>

            <div class="header-right">

                <span>04 Aug 2026</span>

            </div>

        </header>

        <!-- Summary -->

        <section class="summary">

            <div class="card">
                <h3>Social Posts</h3>
                <h2>126</h2>
            </div>

            <div class="card">
                <h3>Upcoming</h3>
                <h2>8</h2>
            </div>

            <div class="card">
                <h3>Vote Guide</h3>
                <h2>14</h2>
            </div>

            <div class="card">
                <h3>YouTube</h3>
                <h2>37</h2>
            </div>

        </section>

        <!-- Content -->

        <section class="content-grid">

            <div class="recent">

                <h2>Recent Activity</h2>

            </div>

            <div class="quick">

                <h2>Quick Actions</h2>

                <button>+ New Social Post</button>

                <button>+ Add Schedule</button>

                <button>+ Add Vote Guide</button>

                <button>+ Add Guide</button>

            </div>

        </section>

    </main>

</div>

<script src="js/app.js"></script>

</body>
</html>
