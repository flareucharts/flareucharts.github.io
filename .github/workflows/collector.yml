name: K-Chart Collector

on:
  workflow_dispatch:

  schedule:
    - cron: "0 * * * *"

# Mencegah workflow collector yang sama
# berjalan bersamaan.
concurrency:
  group: k-chart-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # =====================================================
      # PYTHON
      # =====================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # =====================================================
      # DEPENDENCIES
      # =====================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4


      # =====================================================
      # RUN COLLECTOR
      # =====================================================

      - name: Run K-Chart collector
        run: |
          python Python/collector.py


      # =====================================================
      # SAVE ALL JSON
      # =====================================================

      - name: Save JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/*.json

          if git diff --cached --quiet; then
            echo "No JSON changes to commit."
            exit 0
          fi

          git commit -m "Update K-Chart data"

          # Ambil perubahan terbaru dari remote.
          git fetch origin main

          # Susun commit collector di atas commit terbaru.
          git rebase origin/main

          # Kirim perubahan ke GitHub.
          git push origin HEAD:main
