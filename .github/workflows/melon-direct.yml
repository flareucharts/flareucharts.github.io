name: Melon Direct Collector

on:
  workflow_dispatch:

  schedule:
    - cron: "0 * * * *"

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run Melon Direct Collector
        run: |
          python Python/melon_collector.py

      - name: Save JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/melon_charts.json

          git diff --cached --quiet || git commit -m "Update Melon chart data"

          git push
