
name: FLARE U Kworb Collector

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: flareu-kworb-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install requests beautifulsoup4

      - name: Run FLARE U collector
        run: python Python/kworb.py

      - name: Commit snapshot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add kworb_data/

          if git diff --cached --quiet; then
            echo "No new snapshot changes."
          else
            git commit -m "Update FLARE U Kworb snapshot"
            git push
          fi
