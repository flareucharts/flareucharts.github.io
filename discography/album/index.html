<!DOCTYPE html>
<html lang="en">

<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0">  
<title>Album Detail</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="./album.css">

</head>

<body>
<div class="app">

<!-- HOME -->
<div class="page active" id="home">

<div class="album-page">

<!-- BACK -->

  <a href="../" class="back-btn">
    <img src="https://cdn-icons-png.flaticon.com/512/2732/2732652.png">
  </a>
  <div class="album-layout">
    <!-- LEFT -->
    <div class="album-left">
      <div class="cover-wrap">
          <img id="albumCover" class="cover">

        <a href="#" class="play-btn">
          <img src="https://cdn-icons-png.flaticon.com/512/483/483054.png">
        </a>
      </div>
      <div class="album-info">
<div
  class="album-type"
  id="albumType">
</div>
<h4
  class="album-title"
  id="albumTitle">
</h4>
        <div
  class="artist"
  id="albumArtist">
</div>
      </div>
    </div>
<div class="section-divider">•••</div>
    <!-- RIGHT -->

    <div class="album-right">
      <div class="tracklist">
        <h5>Tracklist</h5>
        <ol id="trackList"></ol>
      </div>
    </div>
  </div>

  <!-- VIDEO -->
  <div class="video-section">
    <h6>VIDEO:</h6>
    <div class="video-card">
      <iframe id="albumVideo" allowfullscreen></iframe>
    </div>
  </div>

<div class="play-sheet" id="playSheet">

  <div class="listen-sheet">

  <h3 class="sheet-title">
    Listen on 🎧
  </h3>

  <a id="spotifyLink" class="platform">
    <img src="https://i.postimg.cc/PrYKbZcy/51rtt-Y7a-9L.png" alt="Spotify">
    <span>Spotify</span>
  </a>

  <a id="appleLink" class="platform">
    <img src="https://i.postimg.cc/dQzJXP1K/Apple-Music-icon-svg.png" alt="Apple Music">
    <span>Apple Music</span>
  </a>

  <a id="youtubeMusicLink" class="platform">
    <img src="icons/youtubemusic.png" alt="YouTube Music">
    <span>YouTube Music</span>
  </a>

  <a id="melonLink" class="platform">
    <img src="icons/melon.png" alt="Melon">
    <span>Melon</span>
  </a>

  <a id="genieLink" class="platform">
    <img src="icons/genie.png" alt="Genie">
    <span>Genie</span>
  </a>

  <a id="bugsLink" class="platform">
    <img src="icons/bugs.png" alt="Bugs">
    <span>Bugs</span>
  </a>
</div>
</div>
</div>
</body>

<script src="../../js/data.js"></script>

<script>

const playBtn = document.querySelector(".play-btn");
const playSheet = document.getElementById("playSheet");

playBtn.addEventListener("click", (e)=>{
  e.preventDefault();
  playSheet.classList.add("show");
});

document.addEventListener("click",(e)=>{
  if(
    !playSheet.contains(e.target) &&
    !playBtn.contains(e.target)
  ){
    playSheet.classList.remove("show");
  }
});

const slug =
  new URLSearchParams(
    window.location.search
  ).get("slug");

const album =
  window.discography.find(
    item => item.slug?.trim().toLowerCase() ===
            slug?.trim().toLowerCase()
  );

if(!album){
  alert("Album not found");
  throw new Error("Album not found");
}

console.log("Slug:", slug);
console.log("Album:", album);

  const albumCover =
  document.getElementById("albumCover");

albumCover.src =
  "../../images/albums/" + album.cover;
albumCover.onload = () => {
  const canvas =
    document.createElement("canvas");
  const ctx =
    canvas.getContext("2d");
  canvas.width = 100;
  canvas.height = 100;
  ctx.drawImage(
    albumCover,
    0,0,100,100
  );
  const data =
    ctx.getImageData(
      0,0,100,100
    ).data;
  let r=0,g=0,b=0,count=0;
  for(let i=0;i<data.length;i+=4){
    r += data[i];
    g += data[i+1];
    b += data[i+2];
    count++;
  }
  r = Math.round(r/count);
  g = Math.round(g/count);
  b = Math.round(b/count);
  document.body.style.background =
  `linear-gradient(
    180deg,
    rgb(${r},${g},${b}) 0%,
    #f4fffc 100%
  )`;

document.documentElement.style.background =
`linear-gradient(
  180deg,
  rgb(${r},${g},${b}) 0%,
  #f4fffc 100%
)`;

document.body.style.background =
`linear-gradient(
  180deg,
  rgb(${r},${g},${b}) 0%,
  #f4fffc 100%
)`;

document.getElementById("home").style.background =
`linear-gradient(
  180deg,
  rgba(${r},${g},${b},0.85) 0%,
  rgba(${r},${g},${b},0.35) 40%,
  #f4fffc 100%
)`;
}
  document.getElementById("albumType").textContent =
    album.albumType;

  document.getElementById("albumTitle").textContent =
    album.title;

  document.getElementById("albumArtist").textContent =
    album.artist;

  function getYoutubeEmbed(url){
  if(!url) return "";

  const match = url.match(
    /(?:youtu\.be\/|youtube\.com\/watch\?v=|youtube\.com\/shorts\/|m\.youtube\.com\/watch\?v=|music\.youtube\.com\/watch\?v=)([^&?/]+)/
  );

  if(match){
    return `https://www.youtube.com/embed/${match[1]}`;
  }

  return url;
}

if (album.video) {
  document.getElementById("albumVideo").src =
    getYoutubeEmbed(album.video);
}

  document.getElementById("spotifyLink").href =
    album.spotify;

  document.getElementById("appleLink").href =
    album.apple;

  document.getElementById("youtubeMusicLink").href =
    album.youtubeMusic;

  document.getElementById("melonLink").href =
    album.melon;

  document.getElementById("genieLink").href =
    album.genie;

  document.getElementById("bugsLink").href =
    album.bugs;


const trackList =
  document.getElementById("trackList");

trackList.innerHTML = "";

console.log(album.tracks);

album.tracks.split("|").forEach(track => {
  const li = document.createElement("li");
  li.textContent = track.trim();
  trackList.appendChild(li);
});
</script>
</html>
