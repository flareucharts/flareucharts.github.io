<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FLARE U GLOBAL — Updates</title>

<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/chart.css">
</head>

<body>

<div class="app">

<section class="page active">

<main class="global-content">

<section class="updated-page">

    <!-- =========================
         STICKY HEADER
    ========================= -->

    <section class="updated-sticky">
        <div class="updated-header">

            <button
                type="button"
                class="updated-back-button"
                onclick="location.href='/'"
                aria-label="Go back"
            >

                <svg
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                >
                    <path
                        d="M15 18L9 12L15 6"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />
                </svg>

            </button>

            <h1 class="updated-title">
                FLARE U GLOBAL
                <span>UPDATES</span>
            </h1>

        </div>
    </section>

<div class="page update-list">
   <article class="updated-item">
   <button
       type="button"
       class="updated-item-toggle"
       aria-expanded="false">

   <div class="updated-item-info">
      <span class="updated-item-title">
       Comeback Voting Info
      </span>

      <span class="updated-item-date">
       18 Sep 2026
      </span>
   </div>
      <svg
       class="updated-chevron"
       width="18"
       height="18"
       viewBox="0 0 24 24"
       fill="none"
       xmlns="http://www.w3.org/2000/svg">

      <path
       d="M6 9L12 15L18 9"
       stroke="currentColor"
       stroke-width="2"
       stroke-linecap="round"
       stroke-linejoin="round"/>

      </svg>
   </button>
   

   <!-- X POST CONTENT -->
 
   <div class="updated-item-content" hidden>
   <div class="updated-x-post">
   <blockquote class="twitter-tweet">
     <a  href="https://x.com/FLAREUGLOBAL/status/2084461208565116962">
     </a>
   </blockquote>
   </div>
   </div>
</article>

</div>
</section>
</main>
</div>

<!-- =========================
     X EMBED
========================= -->

<script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>

<!-- =========================
      UPDATED ACCORDION
========================= -->

<script>

document.addEventListener("DOMContentLoaded", () => {
 const items = document.querySelectorAll(".updated-item");
   items.forEach(item => {
      const toggle =
         item.querySelector(
            ".updated-item-toggle"
         );

      const content =
         item.querySelector(
            ".updated-item-content"
          );

    if (!toggle || !content) return;
    
    toggle.addEventListener("click", () => {

      const isOpen =
         toggle.getAttribute(
            "aria-expanded"
          ) === "true";

/* =========================
     CLOSE OTHER ITEMS
========================= */

    items.forEach(otherItem => {
       if (otherItem === item) return;
          const otherToggle =
            otherItem.querySelector(
               ".updated-item-toggle"
            );

          const otherContent =
            otherItem.querySelector(
               ".updated-item-content"
            );

       if (
          !otherToggle ||
          !otherContent
       ) return;

       otherToggle.setAttribute(
          "aria-expanded",
          "false"
       );

       otherContent.hidden = true;
       });

/* =========================
   TOGGLE CURRENT ITEM
========================= */

       if (isOpen) {
          toggle.setAttribute(
             "aria-expanded",
             "false"
          );

       content.hidden = true;
          } else {

          toggle.setAttribute(
             "aria-expanded",
             "true"
           );

       content.hidden = false;
           }
       });
     });
   });
</script>

</body>

</html>

<style>
/* =========================
   UPDATED PAGE
========================= */

.updated-page {
    width: 100%;
    max-width: 768px;
    margin: 0 auto;
}


/* =========================
   STICKY HEADER
========================= */

.updated-sticky {
    position: sticky;
    top: 0;
    z-index: 20;
    background: #ffffff;
    padding: 0;
}


/* =========================
   HEADER
========================= */

.updated-header {
    position: relative;
    width: 100%;
    min-height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0;
    box-sizing: border-box;
}


/* =========================
   BACK BUTTON
========================= */

.updated-back-button {
    position: absolute;
    left: 0;
    width: 42px;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border: none;
    border-radius: 10px;
    background: transparent;
    color: #222;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

.updated-back-button:active {
    background: #f2f5f5;
}


/* =========================
   TITLE
========================= */

.updated-title {
    display: flex;
    flex-direction: column;
    align-items: center;

    margin: 0;

    color: #222;

    font-size: 14px;
    font-weight: 700;

    line-height: 1.25;
    letter-spacing: -.2px;
}


.updated-title span {
    margin-top: 2px;
    color: #7d8988;

    font-size: 10px;
    font-weight: 600;

    line-height: 1;
    letter-spacing: 1.2px;
}


/* =========================
   UPDATE LIST
========================= */

.page.update-list{
    width:100%;
    max-width:768px;
    margin:0 auto;
    padding: 0 16px;
    display:flex;
    flex-direction:column;
    box-sizing: border-box;
}


/* =========================
   UPDATE ITEM
========================= */

.updated-item {
    width: 100%;
    border-bottom: 1px solid #e7eeee;
}

.updated-item:first-child {
    border-top: 1px solid #e7eeee;
}


/* =========================
   TOGGLE
========================= */

.updated-item-toggle {
    width: 100%;
    min-height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 0;
    border: none;
    background: #ffffff;
    color: #222;
    text-align: left;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    box-sizing: border-box;
}

/* =========================
   STICKY WHEN OPEN
========================= */

.updated-item-toggle[aria-expanded="true"] {
    position: sticky;

    /*
     * Header:
     * padding top 10px
     * header min-height 42px
     * padding bottom 8px
     *
     * = 60px
     */
    top: 60px;

    z-index: 10;

    background: #ffffff;
}

.updated-item-toggle:active {
    opacity: .65;
}


/* =========================
   TITLE + DATE
========================= */

.updated-item-info {
    min-width: 0;

    display: flex;
    flex-direction: column;

    gap: 3px;
}


.updated-item-title {
    display: block;

    color: #252b2b;

    font-size: 13px;
    font-weight: 600;

    line-height: 1.4;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}


.updated-item-date {
    display: block;

    color: #8b9695;

    font-size: 10px;
    font-weight: 500;

    line-height: 1.3;
}


/* =========================
   CHEVRON
========================= */

.updated-chevron {
    flex: 0 0 auto;

    width: 16px;
    height: 16px;

    color: #899493;

    transition:
        transform .22s ease,
        color .22s ease;
}


.updated-item-toggle[aria-expanded="true"] .updated-chevron {
    transform: rotate(180deg);
    color: #5DB7AB;
}


/* =========================
   DROPDOWN CONTENT
========================= */

.updated-item-content {
    width: 100%;

    padding: 0 0 12px;

    box-sizing: border-box;
}


/* =========================
   X POST
========================= */

.updated-x-post {
    width: 100%;

    display: flex;
    justify-content: center;

    overflow: hidden;
}


.updated-x-post .twitter-tweet {
    width: 100% !important;
    max-width: 768px !important;

    margin: 0 auto !important;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 768px) {

    .updated-sticky {
        padding: 10px 16px 8px;
    }

    .updated-header {
        min-height: 42px;
    }

    .updated-title {
        font-size: 13.5px;
    }

    .updated-title span {
        font-size: 9.5px;
    }

}

</style>
