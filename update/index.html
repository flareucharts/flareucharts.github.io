    ========================= -->

    <script
        async
        src="https://platform.twitter.com/widgets.js"
        charset="utf-8"
    ></script>


    <!-- =========================
         UPDATED ACCORDION
    ========================= -->

    <script>

        document.addEventListener("DOMContentLoaded", () => {

            const items =
                document.querySelectorAll(".updated-item");


            items.forEach(item => {

                const toggle =
                    item.querySelector(
                        ".updated-item-toggle"
                    );

                const content =
                    item.querySelector(
                        ".updated-item-content"
                    );


                if (!toggle || !content) return;


                toggle.addEventListener("click", () => {

                    const isOpen =
                        toggle.getAttribute(
                            "aria-expanded"
                        ) === "true";


                    /* =========================
                       CLOSE OTHER ITEMS
                    ========================= */

                    items.forEach(otherItem => {

                        if (otherItem === item) return;


                        const otherToggle =
                            otherItem.querySelector(
                                ".updated-item-toggle"
                            );

                        const otherContent =
                            otherItem.querySelector(
                                ".updated-item-content"
                            );


                        if (
                            !otherToggle ||
                            !otherContent
                        ) return;


                        otherToggle.setAttribute(
                            "aria-expanded",
                            "false"
                        );

                        otherContent.hidden = true;

                    });


                    /* =========================
                       TOGGLE CURRENT ITEM
                    ========================= */

                    if (isOpen) {

                        toggle.setAttribute(
                            "aria-expanded",
                            "false"
                        );

                        content.hidden = true;

                    } else {

                        toggle.setAttribute(
                            "aria-expanded",
                            "true"
                        );

                        content.hidden = false;

                    }

                });

            });

        });

    </script>

<style>
